schema_version: 1

context:
  name: hpc05
  version: 2.0.6
  sha256: caef40ed18042fafa5e37b61727a65d91d111ef077390a45c2d9288e3e47bca9

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/basnijholt/hpc05/archive/v${{ version }}.zip
  sha256: ${{ sha256 }}
  file_name: ${{ version }}.zip

build:
  number: 5
  skip: match(python, "<3.6") or win
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - paramiko
    - ipyparallel
    - tornado
    - pexpect
    - psutil
    - dill

tests:
  - python:
      imports:
        - hpc05
        - hpc05_culler
        - hpc05_monitor
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: ipyparallel Client and convenience package for a PBS or SLURM cluster with a headnode.
  homepage: https://hpc05.readthedocs.io/
  repository: https://github.com/basnijholt/hpc05

extra:
  recipe-maintainers:
    - basnijholt
